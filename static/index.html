<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achados e Perdidos · UNIMA</title>
<style>
:root{--mag:#e4005b;--mag-d:#b80049;--teal:#0f766e;--ink:#221c27;--mut:#6b6472;--bg:#f6f3f7;--card:#fff;--line:#e3dde7}
@media (prefers-color-scheme:dark){:root{--ink:#f1ecf4;--mut:#a79eb0;--bg:#17131b;--card:#221c28;--line:#3a3242;--mag:#ff4d8d;--mag-d:#ff7aa8;--teal:#4fd1c5}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
h1{margin:0;font-size:1.35rem;letter-spacing:-.01em}
h1 b{color:var(--mag)}
.who{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--mut)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px}
button:hover{border-color:var(--mag)}
button.pri{background:var(--mag);border-color:var(--mag);color:#fff;font-weight:600}
button.pri:hover{background:var(--mag-d)}
button.link{border:0;background:none;padding:4px 6px;color:var(--mut);text-decoration:underline}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.hero{padding:28px 0 8px}
.hero p{margin:4px 0 0;color:var(--mut);max-width:60ch}
.hero h2{margin:0;font-size:1.9rem;letter-spacing:-.02em}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin:18px 0}
.filters input,.filters select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar label{font-size:.9rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding-bottom:40px}
.tag{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--mag);border-radius:4px 12px 12px 4px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative}
.tag.achado{border-left-color:var(--teal)}
.tag.devolvido{opacity:.6;border-left-color:var(--mut)}
.tag h3{margin:0;font-size:1.05rem}
.badge{font-size:.8rem;font-weight:700;color:var(--mag)}
.tag.achado .badge{color:var(--teal)}
.tag.devolvido .badge{color:var(--mut)}
.meta{font-size:.88rem;color:var(--mut)}
.desc{margin:0;font-size:.95rem}
.contact{font-size:.9rem;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.acts button{padding:5px 10px;font-size:.85rem}
.contact a{color:var(--mag);font-weight:600}
.empty{grid-column:1/-1;text-align:center;padding:40px 12px;color:var(--mut);border:1px dashed var(--line);border-radius:12px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(440px,94vw);padding:20px}
dialog::backdrop{background:rgba(20,10,25,.5)}
dialog h2{margin:0 0 12px;font-size:1.2rem}
dialog label{display:block;font-size:.88rem;margin-top:10px;color:var(--mut)}
dialog input,dialog select,dialog textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-top:3px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.err{color:#c0152f;font-size:.9rem;min-height:1.2em;margin:10px 0 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:9}
@media (max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap top">
  <h1>Achados e Perdidos <b>UNIMA</b></h1>
  <div class="who" id="who"></div>
</div></header>

<main class="wrap">
  <section class="hero">
    <h2>Perdeu algo no campus? Achou algo que não é seu?</h2>
    <p>Busque entre os itens registrados ou cadastre o seu. Para ver o contato de quem registrou, entre na sua conta.</p>
  </section>

  <div class="filters" role="search">
    <input id="q" type="search" placeholder="Buscar por nome, descrição ou local" aria-label="Buscar">
    <select id="ftipo" aria-label="Tipo"><option value="">Perdidos e achados</option><option value="perdido">Só perdidos</option><option value="achado">Só achados</option></select>
    <select id="fcat" aria-label="Categoria"><option value="">Todas as categorias</option></select>
    <select id="fstatus" aria-label="Situação"><option value="aberto">Em aberto</option><option value="devolvido">Devolvidos</option><option value="">Todos</option></select>
  </div>

  <div class="bar">
    <label><input type="checkbox" id="meus"> Mostrar só os meus registros</label>
    <button class="pri" id="novo">Registrar item</button>
  </div>
  <div class="grid" id="lista" aria-live="polite"></div>
</main>

<dialog id="dAuth"><form method="dialog" id="fAuth">
  <h2 id="authTitle">Entrar</h2>
  <label id="lNome">Nome<input id="aNome" autocomplete="name"></label>
  <label>E-mail<input id="aEmail" type="email" autocomplete="email" required></label>
  <label>Senha (mínimo 6 caracteres)<input id="aSenha" type="password" autocomplete="current-password" required></label>
  <p class="err" id="aErr"></p>
  <div class="row"><button type="button" class="link" id="aSwap"></button><button type="button" id="aCancel">Cancelar</button><button class="pri" id="aOk" type="submit"></button></div>
</form></dialog>

<dialog id="dItem"><form method="dialog" id="fItem">
  <h2 id="itemTitle">Registrar item</h2>
  <label>O que aconteceu?<select id="iTipo"><option value="perdido">Perdi um item</option><option value="achado">Achei um item</option></select></label>
  <label>Título<input id="iTitulo" maxlength="80" required placeholder="Ex.: Carteira preta"></label>
  <label>Descrição<textarea id="iDesc" rows="3" maxlength="400" placeholder="Cor, marca, detalhes que ajudem a identificar"></textarea></label>
  <label>Categoria<select id="iCat"></select></label>
  <label>Local<input id="iLocal" maxlength="80" required placeholder="Ex.: Biblioteca, bloco B"></label>
  <label>Data<input id="iData" type="date"></label>
  <label>E-mail de contato<input id="iEmail" type="email" placeholder="seu@email.com"></label>
  <label>Telefone ou WhatsApp<input id="iTel" type="tel" inputmode="tel" placeholder="(82) 99999-8888"></label>
  <p class="meta">Preencha ao menos um dos dois. Só usuários logados veem o contato.</p>
  <p class="err" id="iErr"></p>
  <div class="row"><button type="button" id="iCancel">Cancelar</button><button class="pri" type="submit">Salvar</button></div>
</form></dialog>
<div id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
let user = null, editId = null, modoCadastro = false;

async function api(path, method = "GET", body) {
  let r;
  try {
    r = await fetch("/api" + path, {method, headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  } catch (e) {
    throw new Error("Não foi possível falar com o servidor. Confira se o 'python app.py' está rodando e abra http://localhost:5000.");
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.erro || "Algo deu errado. Tente novamente.");
  return data;
}
function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2600)}
function el(tag, cls, text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
const fmtTel = n => n.length===11 ? `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}` : n.length===10 ? `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}` : n;
const fmt = iso => iso.split("-").reverse().join("/");

function renderWho(){
  const w=$("who"); w.replaceChildren();
  if(user){ w.append(el("span","",`Olá, ${user.nome}`)); const b=el("button","link","Sair"); b.onclick=async()=>{await api("/logout","POST");user=null;renderWho();load()}; w.append(b); }
  else { const b=el("button","","Entrar ou criar conta"); b.onclick=()=>openAuth(false); w.append(b); }
}

function card(i){
  const t = el("article", `tag ${i.tipo} ${i.status}`);
  t.append(el("span","badge", i.status==="devolvido" ? "Devolvido" : i.tipo==="perdido" ? "Perdido" : "Achado"));
  t.append(el("h3","",i.titulo));
  if(i.descricao) t.append(el("p","desc",i.descricao));
  t.append(el("div","meta",`${i.categoria} · ${i.local} · ${fmt(i.data)}`));
  const c = el("div","contact");
  if(i.contato){
    c.append(`Contato de ${i.autor}: `);
    const links=[];
    if(i.contato.email){ const a=el("a","",i.contato.email); a.href="mailto:"+i.contato.email; links.push(a); }
    if(i.contato.telefone){ const n=i.contato.telefone; const a=el("a","",fmtTel(n)); a.href="https://wa.me/"+(n.length<=11?"55"+n:n); a.target="_blank"; a.rel="noopener"; links.push(a); }
    links.forEach((a,k)=>{ if(k) c.append(" · "); c.append(a); });
  } else c.textContent="Entre na sua conta para ver o contato.";
  t.append(c);
  if(i.meu){
    const a=el("div","acts");
    if(i.status==="aberto"){ const d=el("button","","Marcar como devolvido"); d.onclick=async()=>{await api(`/itens/${i.id}/devolver`,"POST");toast("Item marcado como devolvido.");load()}; a.append(d);
      const e=el("button","","Editar"); e.onclick=()=>openItem(i); a.append(e); }
    const x=el("button","","Excluir"); x.onclick=async()=>{if(confirm("Excluir este registro?")){await api(`/itens/${i.id}`,"DELETE");toast("Registro excluído.");load()}}; a.append(x);
    t.append(a);
  }
  return t;
}

async function load(){
  const p = new URLSearchParams();
  if($("q").value.trim()) p.set("q",$("q").value.trim());
  for(const [k,id] of [["tipo","ftipo"],["categoria","fcat"],["status","fstatus"]]) if($(id).value) p.set(k,$(id).value);
  if($("meus").checked && user) p.set("meus","1");
  const itens = await api("/itens?"+p);
  const g=$("lista"); g.replaceChildren();
  if(!itens.length){ g.append(el("div","empty","Nenhum item encontrado. Ajuste a busca ou registre um item.")); return; }
  itens.forEach(i=>g.append(card(i)));
}

function openAuth(cad){
  modoCadastro=cad; $("authTitle").textContent=cad?"Criar conta":"Entrar";
  $("lNome").style.display=cad?"block":"none"; $("aOk").textContent=cad?"Criar conta":"Entrar";
  $("aSwap").textContent=cad?"Já tenho conta":"Criar conta"; $("aErr").textContent="";
  if(!$("dAuth").open) $("dAuth").showModal();
}
function openItem(i){
  if(!user){ openAuth(false); return; }
  editId = i ? i.id : null; $("itemTitle").textContent = i ? "Editar item" : "Registrar item";
  $("iTipo").value=i?i.tipo:"perdido"; $("iTitulo").value=i?i.titulo:""; $("iDesc").value=i?i.descricao:"";
  $("iCat").value=i?i.categoria:$("iCat").options[0].value; $("iLocal").value=i?i.local:"";
  $("iData").value=i?i.data:new Date().toISOString().slice(0,10);
  $("iEmail").value=i?(i.contato.email||""):(user.email||""); $("iTel").value=i?(i.contato.telefone||""):""; $("iErr").textContent="";
  $("dItem").showModal();
}

$("aSwap").onclick=()=>openAuth(!modoCadastro);
$("aCancel").onclick=()=>$("dAuth").close();
$("iCancel").onclick=()=>$("dItem").close();
$("novo").onclick=()=>openItem(null);
$("fAuth").onsubmit=async e=>{
  e.preventDefault();
  try{
    const body={email:$("aEmail").value,senha:$("aSenha").value}; if(modoCadastro) body.nome=$("aNome").value;
    user = await api(modoCadastro?"/register":"/login","POST",body);
    $("dAuth").close(); $("fAuth").reset(); renderWho(); toast(`Bem-vindo(a), ${user.nome}!`); load();
  }catch(err){ $("aErr").textContent=err.message }
};
$("fItem").onsubmit=async e=>{
  e.preventDefault();
  const body={tipo:$("iTipo").value,titulo:$("iTitulo").value,descricao:$("iDesc").value,categoria:$("iCat").value,local:$("iLocal").value,data:$("iData").value,contato_email:$("iEmail").value,contato_telefone:$("iTel").value};
  try{
    await api(editId?`/itens/${editId}`:"/itens", editId?"PUT":"POST", body);
    $("dItem").close(); toast(editId?"Item atualizado.":"Item registrado."); load();
  }catch(err){ $("iErr").textContent=err.message }
};
let timer; $("q").oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};
["ftipo","fcat","fstatus","meus"].forEach(id=>$(id).onchange=load);

(async()=>{
  const cats = await api("/categorias");
  cats.forEach(c=>{$("fcat").append(new Option(c,c)); $("iCat").append(new Option(c,c))});
  user = await api("/me"); renderWho(); load();
})();
</script>
</body>
</html>
